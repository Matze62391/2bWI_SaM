<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="passwort-container">
      <h1>Passwort Generator</h1>
      <input type="text" readonly id="password">

      <img src="Bilder/copy.png" alt="copy" height="20px" onclick="copyPassword()">

      <div class="option">
        <label for="length">Länge:</label>
        <input type="number" id="length" value="12" min="4" max="32">
      </div>
      <div class="options">
        <label><input type="checkbox" checked>Großbuchstaben</label>
      </div>
      <div class="options">
        <label><input type="checkbox" checked>Kleinbuchstaben</label>
      </div>
      <div class="options">
        <label><input type="checkbox" checked>Zahlen</label>
      </div>
      <div class="options">
        <label><input type="checkbox" checked>Sonderzeichen</label>
      </div>
    </div>
    <button onclick="generatePassword()">Generieren</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
